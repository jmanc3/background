<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Say a song</title>
<style>
  :root {
    --bg-deep: #050816;
    --bg-glow: #0d2a6b;
    --ink: #eaf2ff;
    --muted: #8da3cc;
    --blue-1: #5cc8ff;
    --blue-2: #1580ff;
    --blue-3: #0b3fd1;
    --err: #ff9a94;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100dvh;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(120% 70% at 50% 28%, var(--bg-glow) 0%, rgba(13,42,107,0) 62%),
      var(--bg-deep);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Mic ---------- */
  .mic-wrap {
    position: relative;
    width: min(60vw, 240px);
    aspect-ratio: 1;
    margin-bottom: 44px;
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(92, 200, 255, 0.55);
    background: radial-gradient(circle, rgba(40,140,255,.12), rgba(40,140,255,0) 70%);
    opacity: 0;
    pointer-events: none;
  }
  body[data-state="listening"] .ring { animation: pulse 2.4s ease-out infinite; }
  body[data-state="listening"] .ring:nth-child(2) { animation-delay: .8s; }
  body[data-state="listening"] .ring:nth-child(3) { animation-delay: 1.6s; }
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: .75; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  .spinner {
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: var(--blue-1);
    border-right-color: rgba(92,200,255,.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  body[data-state="searching"] .spinner { opacity: 1; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #mic {
    position: absolute;
    inset: 0;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: #fff;
    background: radial-gradient(circle at 34% 26%, var(--blue-1) 0%, var(--blue-2) 52%, var(--blue-3) 100%);
    box-shadow:
      0 0 70px rgba(30, 130, 255, .55),
      0 18px 40px rgba(0, 10, 60, .55),
      inset 0 10px 22px rgba(255, 255, 255, .28),
      inset 0 -14px 30px rgba(0, 20, 130, .5);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #mic svg { width: 42%; height: 42%; fill: currentColor; filter: drop-shadow(0 4px 8px rgba(0,20,120,.45)); }
  #mic:active { transform: scale(.95); }
  #mic:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
  body[data-state="listening"] #mic { transform: scale(.94); }
  body[data-state="searching"] #mic { opacity: .85; }
  #voiceQueue {
    position: absolute; right: -8px; bottom: -8px; width: 54px; height: 54px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; color: var(--ink);
    background: #0b3fd1; border: 2px solid rgba(180,225,255,.8);
    box-shadow: 0 8px 20px rgba(0,10,60,.5);
  }
  #voiceQueue svg { width: 25px; height: 25px; fill: currentColor; }
  #voiceQueue:active { transform: scale(.93); }
  #voiceQueue:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ---------- Text ---------- */
  .text { text-align: center; max-width: 440px; min-height: 76px; margin-bottom: 28px; }
  #status { font-size: 19px; font-weight: 600; line-height: 1.3; margin: 0; }
  #status.err { color: var(--err); font-weight: 500; }
  #sub { margin: 8px 0 0; font-size: 15px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }

  /* ---------- Playback controls ---------- */
  .transport { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #play {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1.5px solid rgba(160, 200, 255, .4);
    background: rgba(255, 255, 255, .07);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform .15s ease, background .2s, opacity .2s;
  }
  #play svg { width: 34px; height: 34px; fill: currentColor; }
  #play:active { transform: scale(.93); }
  #play:disabled { opacity: .3; cursor: default; }
  #play:not(:disabled):hover { background: rgba(255, 255, 255, .13); }
  #play:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  #play .i-pause { display: none; }
  #play.on .i-pause { display: block; }
  #play.on .i-play { display: none; }
  .skip {
    width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(160, 200, 255, .3);
    background: rgba(255,255,255,.05); color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  .skip svg { width: 26px; height: 26px; fill: currentColor; }
  .skip:active { transform: scale(.93); }
  .skip:disabled { opacity: .3; cursor: default; }
  .skip:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .seek {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(160, 200, 255, .25);
    background: rgba(255,255,255,.04); color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  .seek svg { width: 25px; height: 25px; fill: currentColor; }
  .seek:active { transform: scale(.93); }
  .seek:disabled { opacity: .3; cursor: default; }
  .seek:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #seekBar {
    width: min(100%, 430px); height: 5px; margin: 0 0 13px; accent-color: var(--blue-1); cursor: pointer;
  }
  #seekBar:disabled { opacity: .3; cursor: default; }

  /* ---------- Queue ---------- */
  #queueArea { width: min(100%, 520px); min-height: 102px; margin-top: 16px; }
  #queueHeading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  #queueHeading span { font-size: 12px; color: var(--muted); }
  #clearQueue { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 2px; }
  #queueList { display: flex; gap: 10px; overflow-x: auto; list-style: none; padding: 4px 4px 10px; margin: 0; scrollbar-width: thin; }
  #queueList li { position: relative; flex: 0 0 220px; display: flex; gap: 10px; align-items: center; min-width: 0; padding: 9px; border-radius: 10px; background: rgba(255,255,255,.06); cursor: grab; }
  #queueList li.dragging { opacity: .45; }
  #queueList img { width: 76px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: rgba(255,255,255,.1); }
  #queueList .queue-title { color: var(--ink); font-size: 12px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #queueList .remove-queue { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 1px solid rgba(220,240,255,.7); border-radius: 50%; padding: 0; background: #173f85; color: #fff; font: 17px/18px sans-serif; cursor: pointer; }

  /* ---------- Settings ---------- */
  .settings { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; }
  .link {
    background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px;
    cursor: pointer; padding: 8px; text-decoration: underline; text-underline-offset: 3px;
  }
  #panel {
    display: block; margin: 0 auto 4px; max-width: 440px; width: calc(100% - 32px);
    padding: 14px; text-align: left; border-radius: 14px;
    background: rgba(5, 8, 22, .92); border: 1px solid rgba(160,200,255,.2);
  }
  #panel details { margin-top: 12px; }
  #panel summary { font-size: 12.5px; color: var(--muted); cursor: pointer; }
  #panel details p { margin-top: 8px; }
  #panel p { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin: 0 0 8px; }
  #panel .row { display: flex; gap: 8px; }
  #panel input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
    background: rgba(255,255,255,.07); border: 1px solid rgba(160,200,255,.3);
    border-radius: 8px; padding: 9px 11px; user-select: text; -webkit-user-select: text;
  }
  #panel button {
    font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: var(--blue-2);
    border: 0; border-radius: 8px; padding: 0 14px; cursor: pointer;
  }

  /* ---------- Hidden player ---------- */
  #hidden-player {
    position: fixed; left: -9999px; top: 0; width: 200px; height: 200px;
    opacity: 0; pointer-events: none; overflow: hidden;
  }
  #hidden-player iframe { width: 200px; height: 200px; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    #mic, .ring, .spinner { animation: none !important; }
    body[data-state="listening"] .ring { opacity: .35; }
  }
</style>
</head>
<body data-state="idle">

  <div class="mic-wrap">
    <span class="ring"></span><span class="ring"></span><span class="ring"></span>
    <span class="spinner"></span>
    <button id="mic" type="button" aria-label="Tap and say a song name and artist">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <button id="voiceQueue" type="button" aria-label="Say a song to add to the queue" title="Queue a song by voice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12v2H3zm0 5h12v2H3zm0 5h8v2H3zm15-1v-3h-2v3h-3v2h3v3h2v-3h3v-2z"/></svg>
    </button>
  </div>

  <div class="text" aria-live="polite">
    <p id="status">Tap to say a song</p>
    <p id="sub"></p>
  </div>

  <input id="seekBar" type="range" min="0" max="100" step="0.1" value="0" disabled aria-label="Song position">
  <div class="transport" aria-label="Playback controls">
    <button id="previous" class="skip" type="button" disabled aria-label="Previous track or restart track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button id="seekBack" class="seek" type="button" disabled aria-label="Back 10 seconds" title="Back 10 seconds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7v10l-7-5zm8 0v10l-7-5z"/></svg>
    </button>
    <button id="play" type="button" disabled aria-label="Play">
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button id="seekForward" class="seek" type="button" disabled aria-label="Forward 10 seconds" title="Forward 10 seconds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7v10l7-5zm8 0v10l7-5z"/></svg>
    </button>
    <button id="next" class="skip" type="button" disabled aria-label="Next queued track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 6v12l8.5-6z"/></svg>
    </button>
  </div>
  <section id="queueArea" aria-label="Up next">
    <div id="queueHeading"><span id="queueEmpty"></span><button id="clearQueue" type="button" hidden>Clear queue</button></div>
    <ol id="queueList"></ol>
  </section>

  <div class="settings">
    <div id="panel">
      <div class="row">
        <input id="manualQuery" type="text" placeholder="Song and artist" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button id="manualSearch" type="button">Search</button>
        <button id="manualQueue" type="button">Queue</button>
      </div>
      <details>
        <summary>YouTube API key</summary>
        <p>Optional but most reliable (free from Google Cloud Console). Without one, the page tries public search servers, which can be slow or offline.</p>
        <div class="row">
          <input id="apiKey" type="password" placeholder="YouTube Data API key" autocomplete="off" spellcheck="false">
          <button id="saveKey" type="button">Save</button>
        </div>
      </details>
    </div>
  </div>

  <div id="hidden-player" aria-hidden="true"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const micBtn = $('mic'), voiceQueueBtn = $('voiceQueue'), playBtn = $('play'), previousBtn = $('previous'), nextBtn = $('next'), seekBackBtn = $('seekBack'), seekForwardBtn = $('seekForward'), seekBar = $('seekBar'), statusEl = $('status'), subEl = $('sub');
  const holder = $('hidden-player');

  // ---------- small helpers ----------
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function setState(s) { document.body.dataset.state = s; }
  function setStatus(t, isErr) { statusEl.textContent = t; statusEl.classList.toggle('err', !!isErr); }
  function setSub(t) { subEl.textContent = t || ''; }

  // ---------- hidden YouTube player (iframe + postMessage) ----------
  let frame = null, playing = false, heard = false, watchdog = null, hintTimer = null;
  let candidates = [], candIndex = 0, queue = [], history = [], currentTrack = null, previousRequest = false, seekSeconds = null, draggedTrack = null, draggingSeekBar = false;

  function setPlaying(p) {
    playing = p;
    playBtn.classList.toggle('on', p);
    playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
  }

  function command(func, args) {
    if (frame && frame.contentWindow) {
      frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*');
    }
  }

  function loadVideo(id) {
    holder.innerHTML = '';
    heard = false;
    frame = document.createElement('iframe');
    frame.allow = 'autoplay; encrypted-media';
    frame.title = 'Background audio';
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    const origin = /^https?:$/.test(location.protocol) ? '&origin=' + encodeURIComponent(location.origin) : '';
    frame.src = 'https://www.youtube.com/embed/' + id +
      '?enablejsapi=1&autoplay=1&playsinline=1&controls=0&rel=0' + origin;
    frame.addEventListener('load', () => {
      frame.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*');
      command('playVideo');
    });
    holder.appendChild(frame);
    playBtn.disabled = false;

    clearTimeout(watchdog); clearTimeout(hintTimer);
    watchdog = setTimeout(() => {
      if (!heard) { setStatus('Couldn’t reach YouTube. Check your connection or ad blocker.', true); setPlaying(false); }
    }, 10000);
    hintTimer = setTimeout(() => {
      if (heard && !playing && document.body.dataset.state === 'idle' && !statusEl.classList.contains('err')) {
        setStatus('Ready. Tap play to start.');
      }
    }, 4500);
  }

  function playCandidate() {
    const c = candidates[candIndex];
    loadVideo(c.id);
    setPlaying(true);
    setState('idle');
    setStatus('Now playing');
    setSub(c.title || '');
  }

  function activateTrack(track, rememberCurrent = true) {
    if (rememberCurrent && currentTrack) history.push(currentTrack);
    currentTrack = track;
    candidates = track.candidates;
    candIndex = 0;
    playCandidate();
    previousBtn.disabled = false;
    seekBackBtn.disabled = false;
    seekForwardBtn.disabled = false;
    seekBar.disabled = false;
    seekBar.value = 0;
  }

  function renderQueue() {
    const list = $('queueList');
    list.replaceChildren();
    queue.forEach(track => {
      const item = document.createElement('li');
      item.draggable = true;
      item.title = 'Drag to reorder';
      const thumbnail = document.createElement('img');
      thumbnail.src = track.thumbnail || 'https://i.ytimg.com/vi/' + track.candidates[0].id + '/mqdefault.jpg';
      thumbnail.alt = '';
      const title = document.createElement('span');
      title.className = 'queue-title';
      title.textContent = track.title || track.query;
      const remove = document.createElement('button');
      remove.className = 'remove-queue';
      remove.type = 'button';
      remove.setAttribute('aria-label', 'Remove ' + (track.title || track.query) + ' from queue');
      remove.textContent = '×';
      remove.addEventListener('click', () => {
        queue.splice(queue.indexOf(track), 1);
        renderQueue();
      });
      item.addEventListener('dragstart', (e) => {
        draggedTrack = track;
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', track.query);
      });
      item.addEventListener('dragend', () => {
        draggedTrack = null;
        item.classList.remove('dragging');
      });
      item.addEventListener('dragover', (e) => {
        if (draggedTrack && draggedTrack !== track) e.preventDefault();
      });
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!draggedTrack || draggedTrack === track) return;
        const from = queue.indexOf(draggedTrack);
        const to = queue.indexOf(track);
        queue.splice(from, 1);
        queue.splice(from < to ? to - 1 : to, 0, draggedTrack);
        renderQueue();
      });
      item.append(thumbnail, title, remove);
      list.appendChild(item);
    });
    $('queueEmpty').textContent = queue.length ? 'Up next · ' + queue.length : '';
    $('clearQueue').hidden = queue.length === 0;
    nextBtn.disabled = queue.length === 0;
  }

  function playNextInQueue() {
    if (!queue.length) return false;
    const next = queue.shift();
    renderQueue();
    activateTrack(next);
    setStatus('Now playing from queue');
    return true;
  }

  function finishPreviousRequest(time) {
    if (!previousRequest) return;
    previousRequest = false;
    if (time > 6 || !history.length) {
      command('seekTo', [0, true]);
      command('playVideo');
      setStatus('Restarting track');
      return;
    }
    const previous = history.pop();
    activateTrack(previous, false);
    setStatus('Playing previous track');
  }

  window.addEventListener('message', (e) => {
    let host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/youtube(-nocookie)?\.com$/.test(host)) return;
    let data;
    try { data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    if (!data || (frame && e.source !== frame.contentWindow)) return;
    heard = true;

    if (previousRequest && data.info && typeof data.info.currentTime === 'number') finishPreviousRequest(data.info.currentTime);
    if (seekSeconds !== null && data.info && typeof data.info.currentTime === 'number') {
      command('seekTo', [Math.max(0, data.info.currentTime + seekSeconds), true]);
      seekSeconds = null;
    }
    if (data.info && typeof data.info.duration === 'number' && data.info.duration > 0) {
      seekBar.max = data.info.duration;
    }
    if (!draggingSeekBar && data.info && typeof data.info.currentTime === 'number') {
      seekBar.value = Math.min(Number(seekBar.max), data.info.currentTime);
    }

    let st = null;
    if (data.event === 'onStateChange') st = data.info;
    else if (data.event === 'infoDelivery' && data.info && typeof data.info.playerState === 'number') st = data.info.playerState;

    if (st === 1 || st === 3) { setPlaying(true); if (statusEl.textContent.startsWith('Ready')) setStatus('Now playing'); }
    else if (st === 0) {
      setPlaying(false);
      if (!playNextInQueue()) setStatus('Playback finished');
    } else if (st === 2 || st === -1 || st === 5) setPlaying(false);

    if (data.event === 'onError') {
      const code = data.info;
      setPlaying(false);
      if (code === 153) {
        setStatus('YouTube blocked the player. Open this page over https:// or http://localhost, not as a local file.', true);
      } else if (candIndex + 1 < candidates.length) {
        candIndex++;
        setStatus('That one can’t be embedded. Trying the next result…');
        playCandidate();
      } else {
        setStatus('None of the results could be played here. Try saying it again.', true);
      }
    }
  });

  playBtn.addEventListener('click', () => {
    if (!frame) return;
    if (playing) { command('pauseVideo'); setPlaying(false); }
    else { command('playVideo'); setPlaying(true); }
  });

  // ---------- search ----------
  const PIPED = ['https://pipedapi.kavin.rocks', 'https://pipedapi.adminforge.de', 'https://api.piped.private.coffee'];
  const INVIDIOUS = ['https://inv.nadeko.net', 'https://yewtu.be'];

  async function getJSON(url, ms = 7000) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  async function searchYouTube(q) {
    const enc = encodeURIComponent(q + ' Official Audio');
    const key = store.get('yt_api_key');

    if (key) {
      const d = await getJSON('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=5&q=' +
        enc + '&key=' + encodeURIComponent(key));
      return (d.items || []).map(i => ({ id: i.id.videoId, title: decodeHtml(i.snippet.title) }));
    }

    for (const base of PIPED) {
      try {
        const d = await getJSON(base + '/search?q=' + enc + '&filter=videos');
        const out = (d.items || [])
          .filter(i => i.url && i.url.includes('v='))
          .slice(0, 5)
          .map(i => ({ id: new URLSearchParams(i.url.split('?')[1]).get('v'), title: i.title }));
        if (out.length) return out;
      } catch (e) {}
    }
    for (const base of INVIDIOUS) {
      try {
        const d = await getJSON(base + '/api/v1/search?type=video&q=' + enc);
        const out = (Array.isArray(d) ? d : []).slice(0, 5).map(i => ({ id: i.videoId, title: i.title }));
        if (out.length) return out;
      } catch (e) {}
    }
    throw new Error('no-search');
  }

  function decodeHtml(s) { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; }

  async function findAndPlay(q) {
    setState('searching');
    setStatus('Looking for it…');
    setSub('“' + q + '”');
    try {
      candidates = (await searchYouTube(q)).filter(c => c.id);
    } catch (err) {
      setState('idle');
      setStatus(store.get('yt_api_key')
        ? 'Search failed. Check your API key in Search settings.'
        : 'Couldn’t reach a search server. Add a YouTube API key in Search settings.', true);
      return;
    }
    if (!candidates.length) {
      setState('idle');
      setStatus('No results. Tap the mic and try again.', true);
      return;
    }
    activateTrack({ query: q, title: candidates[0].title || q, candidates: candidates });
  }

  async function findAndQueue(q) {
    setState('searching');
    setStatus('Adding to queue…');
    setSub('“' + q + '”');
    let results;
    try {
      results = (await searchYouTube(q)).filter(c => c.id);
    } catch (err) {
      setState('idle');
      setStatus('Couldn’t add that song. Check your connection or API key.', true);
      return;
    }
    if (!results.length) {
      setState('idle');
      setStatus('No results to add. Try another search.', true);
      return;
    }
    queue.push({ query: q, title: results[0].title || q, thumbnail: 'https://i.ytimg.com/vi/' + results[0].id + '/mqdefault.jpg', candidates: results });
    renderQueue();
    setState('idle');
    setStatus('Added to queue');
    setSub(results[0].title || q);
  }

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, transcript = '', recError = '', queueRecognition = false, resumeAfterListening = false;

  function startListening(addToQueue = false) {
    if (!SR) {
      setStatus('Voice input isn’t supported in this browser. Try Chrome or Safari.', true);
      return;
    }
    transcript = ''; recError = ''; queueRecognition = addToQueue;
    resumeAfterListening = !!(frame && playing);
    if (resumeAfterListening) {
      command('pauseVideo');
      setPlaying(false);
    }
    setSub('');
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;

    rec.onresult = (e) => {
      let t = '';
      for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      transcript = t;
      setSub('“' + t.trim() + '”');
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        recError = 'Microphone is blocked. Allow mic access for this page (it needs https).';
      } else if (e.error === 'no-speech') {
        recError = 'Didn’t hear anything. Tap the mic and try again.';
      } else if (e.error === 'audio-capture') {
        recError = 'No microphone found.';
      } else if (e.error !== 'aborted') {
        recError = 'Voice input failed (' + e.error + '). Try again.';
      }
    };
    rec.onend = () => {
      listening = false;
      if (resumeAfterListening) {
        command('playVideo');
        setPlaying(true);
        resumeAfterListening = false;
      }
      if (recError) { setState('idle'); setStatus(recError, true); setSub(''); return; }
      const q = transcript.trim();
      if (!q) { setState('idle'); setStatus('Didn’t catch that. Tap the mic to try again.', true); return; }
      queueRecognition ? findAndQueue(q) : findAndPlay(q);
    };

    try {
      rec.start();
      listening = true;
      setState('listening');
      setStatus(addToQueue ? 'Listening… say a song to queue' : 'Listening… say the song and artist');
    } catch (err) {
      setStatus('Couldn’t start the microphone. Try again.', true);
    }
  }

  micBtn.addEventListener('click', () => {
    if (document.body.dataset.state === 'searching') return;
    if (listening && rec) rec.stop();   // tap again to finish early
    else startListening();
  });
  voiceQueueBtn.addEventListener('click', () => {
    if (document.body.dataset.state === 'searching') return;
    if (listening && rec) rec.stop();
    else startListening(true);
  });

  // ---------- settings ----------
  $('apiKey').value = store.get('yt_api_key');
  function manualSearch() {
    const q = $('manualQuery').value.trim();
    if (!q || document.body.dataset.state === 'searching') return;
    if (listening && rec) { rec.onend = null; rec.onerror = null; try { rec.abort(); } catch (e) {} listening = false; }
    $('panel').classList.remove('open');
    $('manualQuery').blur();
    findAndPlay(q);
  }
  function manualQueue() {
    const q = $('manualQuery').value.trim();
    if (!q || document.body.dataset.state === 'searching') return;
    if (listening && rec) { rec.onend = null; rec.onerror = null; try { rec.abort(); } catch (e) {} listening = false; }
    $('panel').classList.remove('open');
    $('manualQuery').blur();
    findAndQueue(q);
  }
  $('manualSearch').addEventListener('click', manualSearch);
  $('manualQueue').addEventListener('click', manualQueue);
  $('manualQuery').addEventListener('keydown', (e) => { if (e.key === 'Enter') manualSearch(); });
  $('clearQueue').addEventListener('click', () => {
    queue = [];
    renderQueue();
    setStatus('Queue cleared');
  });
  nextBtn.addEventListener('click', () => {
    if (!queue.length) return;
    playNextInQueue();
  });
  previousBtn.addEventListener('click', () => {
    if (!frame || !currentTrack || previousRequest) return;
    previousRequest = true;
    command('getCurrentTime');
    setTimeout(() => finishPreviousRequest(0), 750);
  });
  function seekBy(seconds) {
    if (!frame || seekSeconds !== null) return;
    seekSeconds = seconds;
    command('getCurrentTime');
    setTimeout(() => { seekSeconds = null; }, 750);
  }
  seekBackBtn.addEventListener('click', () => seekBy(-10));
  seekForwardBtn.addEventListener('click', () => seekBy(10));
  seekBar.addEventListener('pointerdown', () => { draggingSeekBar = true; });
  seekBar.addEventListener('pointerup', () => { draggingSeekBar = false; });
  seekBar.addEventListener('input', () => {
    if (!frame) return;
    command('seekTo', [Number(seekBar.value), true]);
  });
  renderQueue();
  $('saveKey').addEventListener('click', () => {
    store.set('yt_api_key', $('apiKey').value.trim());
    $('panel').classList.remove('open');
    setStatus($('apiKey').value.trim() ? 'API key saved' : 'API key cleared');
  });
</script>
</body>
</html>
